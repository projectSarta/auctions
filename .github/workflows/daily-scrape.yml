name: Daily MoJ Auctions Scrape

# Runs 6 slots/day: 01, 04, 07, 16, 19, 22 UTC.
# In Amman time (UTC+3):        04, 07, 10, 19, 22, 01.
# 13:00 and 16:00 Amman (= 10, 13 UTC) removed — the mid-day gap.
#
# MoJ's anti-bot blocks ~4 of 5 runs from GitHub's runner IPs. The "Skip if
# fresh" step at the top of the job avoids doing work when a recent run
# already succeeded — saves runner minutes AND reduces MoJ hit-frequency
# (fewer requests → less anti-bot pressure).
on:
  schedule:
    - cron: '0 1,4,7,16,19,22 * * *'
  workflow_dispatch: {}

# Need write access to push the updated auctions.json + images + reports back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: windows-latest        # Reuse the existing PowerShell + curl.exe stack as-is.
    timeout-minutes: 90            # overnight_run typically finishes in ~30-60 min.
    concurrency:                   # If a previous run is still going, skip the new one.
      group: daily-scrape
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # actions/checkout configures the local git remote with a token that
          # has write access for the lifetime of this job — overnight_run.ps1's
          # Phase 7 (`git push origin main`) will Just Work.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Retry-on-block gate: we run every 3 hours, but if the PREVIOUS run
      # already stamped a healthy batch (30+ rows in the last 2 hours) then
      # nothing needs re-fetching — skip this slot to avoid pinging MoJ
      # unnecessarily. Only manual workflow_dispatch bypasses this check.
      - name: Skip if the last run already succeeded
        id: gate
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $data = Get-Content .\auctions.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $now = [DateTime]::UtcNow
          $recent = @($data.auctions | Where-Object {
            $_.lastSeenInListingAt -and
            ([DateTime]::Parse($_.lastSeenInListingAt).ToUniversalTime() -gt $now.AddHours(-2))
          }).Count
          Write-Host "rows stamped in last 2 hours: $recent"
          if ($recent -ge 30) {
            Write-Host "Previous run already stamped $recent rows within 2h — skipping this slot."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Previous run stamped only $recent rows in last 2h — running scrape."
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Show starting state
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS:     $env:OS"
          curl.exe --version | Select-Object -First 1
          Get-Item .\auctions.json | Select-Object Name, Length, LastWriteTime

      - name: Run overnight orchestration
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          .\overnight_run.ps1
        # Don't fail the whole workflow if one phase hits a captcha — the
        # script itself decides when to bail, and partial progress is still
        # committed by Phase 7.
        continue-on-error: true

      - name: Show ending state + last 3 commits
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          git log --oneline -3
          Get-Item .\auctions.json | Select-Object Name, Length, LastWriteTime
          Write-Host "--- overnight.log tail ---"
          if (Test-Path .\overnight.log) { Get-Content .\overnight.log -Tail 20 }

      - name: Upload run log as artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: overnight-log-${{ github.run_id }}
          path: |
            overnight.log
            overnight_slow.log
          if-no-files-found: ignore
          retention-days: 7
