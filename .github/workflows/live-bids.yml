name: Live Bid Tracker

# MANUAL ONLY — no cron schedule.
#
# HARD CONSTRAINT: nothing in this repo may run between 11:00 and 17:00
# Amman time (08:00-14:00 UTC). MoJ auctions close at 15:00 Amman, INSIDE
# that window, which is exactly when bidding activity concentrates — so
# automated close-time tracking is off the table. Trigger this workflow
# manually (workflow_dispatch) or run live_bids.ps1 locally if close-time
# coverage is ever wanted.
#
# Each session subscribes to lots ending within 30h via MoJ's SignalR
# biddingHub and pushes live_bids.json every 5 minutes; the dashboard
# overlays it (live bids, end-date extensions, cancellations + reasons).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: windows-latest
    timeout-minutes: 70
    concurrency:
      group: live-bids
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run live bid tracker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          .\live_bids.ps1 -Minutes 55 -WindowHours 30 -PushEveryMin 5
        continue-on-error: true
